<!DOCTYPE html>
<!--Creá un archivo HTML nuevo y armá una página sencilla siguiendo estos pasos:
Escribí la estructura básica de un documento HTML (<!DOCTYPE html>, <html>, <head>,
<title> y <body>).
1.
2.Dentro de <title>, poné: Práctica de enlaces.
3.Dentro de <body>, agregá un título principal (<h1>) que diga: Mis páginas favoritas.
4. Creá un enlace que lleve a Google y cuyo texto visible en la página sea Ir a Google.
5.Agregá un salto de línea (<br>) para que el siguiente enlace aparezca abajo.
Creá un segundo enlace que lleve a YouTube o a otro sitio que te guste, agregando el
atributo target="_blank". El texto visible debe ser Ir a YouTube (o el nombre de la página que
elegiste).-->
<head>
    
    <title>Práctica de enlaces</title>
</head>
<body>
    <h1>Mis páginas favoritas</h1>
    <a href="https://www.google.com">Ir a google</a>
    <br>
     <a href="https://www.youtube.com"
    target="_blank">Ir a Youtube</a>
</body>
</html>
